function skLev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}

function actName(a){let s=String(a||'').trim();if(!s||/^Nie op die etiket/i.test(s))return '-';

 segs.forEach(g=>{g=g.replace(/^\s*(Bevat ook|Bevat|plus)\s*:\s*/i,'').trim();if(!g)return;
  if(/^(HRAC|FRAC|IRAC|groep|group)\b/i.test(g)||!/[A-Za-z]/.test(g))return;let m=/^(\d[\d,]*-[A-Za-z][^\s(]*)/.exec(g);if(!m&&/^\d/.test(g))return;let n=m?m[1]:g.replace(/\([^()]*\)/g,' ').split(/\s(?=\d)|\s*\(|\s+[–-]\s+|\s*:\s*(?=[A-Z][a-z]?\s*\d)/)[0];

const nz=v=>String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function unitCls(u){u=String(u||'').toLowerCase().replace('ℓ','l').trim();if(u==='lt'||u==='l'||u==='liter'||u==='litre')return 'l';if(u==='kg')return 'kg';if(u==='ml')return 'ml';if(u==='g'||u==='gr')return 'g';return u}
function priceNum(v){if(v==null||v==='')return null;let t=String(v).replace(/[Rr\s ]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/,/g,'');return num(t)}
function cellTxt(v){if(v==null)return '';if(typeof v==='object'){if(v.result!=null)return cellTxt(v.result);if(v.richText)return v.richText.map(x=>x.text).join('');if(v.text!=null)return String(v.text);if(v instanceof Date)return '';return ''}return String(v)}
function parseCSV(t){const first=t.split(/\r?\n/)[0]||'';const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}row.push(f);rows.push(row);return rows}
function sizeFromName(n){const m=String(n).match(/(\d+(?:[.,]\d+)?)\s*(ml|lt|l|ℓ|kg|g)\b\.?\s*$/i);return m?{size:num(m[1]),unit:m[2],name:String(n).slice(0,m.index).replace(/[-–(\s]+$/,'').trim()}:null}
function impAnalyse(rows,fname){

 for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i];const n=r.findIndex(x=>/produk|product|naam|name|beskryw|descr/i.test(x)&&x.length<40);const p=r.findIndex(x=>/prys|price|cost|koste|excl|incl|^r$|r\/|net/i.test(x)&&x.length<40);if(n>=0&&p>=0&&n!==p){hi=i;cn=n;cp=p;const sz=r.findIndex((x,j)=>j!==p&&j!==n&&/grootte|size|pak|pack|volume|eenheid/i.test(x)&&!/prys|price/i.test(x));cs=sz;break}}
 let start=hi+1;
 if(hi<0){let best=0;const nc=Math.max(...rows.slice(0,50).map(r=>r.length),0);for(let j=0;j<nc;j++){const cnt=rows.filter(r=>priceNum(r[j])!=null&&/\d/.test(r[j])).length;if(cnt>=best){best=cnt;cp=j}}cn=0;for(let j=0;j<nc;j++){if(j!==cp&&rows.filter(r=>/[a-z]{3}/i.test(r[j]||'')).length>rows.filter(r=>/[a-z]{3}/i.test(r[cn]||'')).length)cn=j}start=0}
 const prods=products();const out=[],skip=[];
 for(let i=start;i<rows.length;i++){const r=rows[i];let name=(r[cn]||'').trim();const price=priceNum(r[cp]);if(!name||price==null||price<=0||!/[a-z]{3}/i.test(name))continue;
  let size=null,unit=null;if(cs>=0&&r[cs]){const m=String(r[cs]).match(/(\d+(?:[.,]\d+)?)\s*(ml|lt|l|ℓ|kg|g)?/i);if(m){size=num(m[1]);unit=m[2]||null}}
  if(size==null){const sn=sizeFromName(name);if(sn){size=sn.size;unit=sn.unit;name=sn.name}}
  const nn=nz(name);let hit=prods.find(p=>nz(p.name)===nn);
  if(!hit){const c=prods.filter(p=>{const a=nz(p.name);return a.length>=4&&(nn.includes(a)||a.includes(nn))&&nn.length>=4}).sort((a,b)=>nz(b.name).length-nz(a.name).length);hit=c[0]}

 }
 return {file:fname,rows:out,skip,found:hi>=0}}

function parseLabel(text,fname){
 const L=text.split(/\r?\n/);const flat=L.join('\n');const out={name:'',reg:'',act:'',tipe:'',phi:'',dose:'',pack:null,notes:[]};
 // reg + name
 const ri=L.findIndex(l=>/Reg\.?\s*No\.?:?\s*L\s*\d+/i.test(l));
 if(ri>=0){const m=L[ri].match(/L\s*(\d{3,6})/);out.reg='L '+m[1];for(let i=ri-1;i>=Math.max(0,ri-4);i--){const t=L[i].trim();if(t&&!/READ LABEL|LEES|FOR FULL|VIR VOLLEDIGE/i.test(t)&&t.length<60){out.name=t.replace(/\s{2,}.*/,'');break}}}
 if(!out.name&&fname)out.name=fname.replace(/\.pdf$/i,'').replace(/[-_]?GHS.*$/i,'').replace(/[-_]/g,' ').trim();
 // active
 const ai=L.findIndex(l=>/ACTIVE INGREDIENT|AKTIEWE BESTANDDEEL|AKTIEWE INGREDI/i.test(l));
 if(ai>=0){const acts=[];for(let i=ai+1;i<Math.min(L.length,ai+5);i++){const t=L[i].trim().split(/\s{3,}/)[0];if(!t)continue;if(/\d\s*(g|mg|%)\s*\/?\s*(ℓ|l|kg|L)?/i.test(t)||/\d+\s*g\/(ℓ|kg|l)/i.test(t))acts.push(t);else if(acts.length)break;else if(/^[A-Za-z]/.test(t)&&i>ai+2)break}out.act=acts.join('; ')}
 // type
 const head=flat.slice(0,2500).toUpperCase();
 out.tipe=/FUNGICIDE|SWAMDODER/.test(head)?'Swamdoder':/INSECTICIDE|ACARICIDE|INSEKDODER|MITICIDE/.test(head)?'Insekdoder':/HERBICIDE|ONKRUIDDODER/.test(head)?'Onkruiddoder':/FERTILI[SZ]ER|KUNSMIS|FOLIAR NUTRIENT|BLAARVOEDING/.test(head)?'Kunsmis / blaarvoeding':/ADJUVANT|SURFACTANT|WETTER|BYVOEGMIDDEL|BUFFER/.test(head)?'Byvoegmiddel':'';
 // withholding
 const wi=flat.search(/WITHHOLDING PERIODS?|ONTHOUDINGSPERIODE/i);
 if(wi>=0){let seg=flat.slice(wi,wi+1500);const e=seg.search(/IMPORTANT|BELANGRIK|•/);if(e>0)seg=seg.slice(0,e);seg=seg.replace(/^[^\n]*\n[^\n]*\n?/,'').replace(/\s+/g,' ');
  const items=[];const re=/([A-Za-zÀ-ÿ&\/\(\)\-, ]+?)\s+(\d{1,3})\s*(?:days?|dae?|dag)\b/gi;let m;while((m=re.exec(seg))){let c=m[1].replace(/^[\s|,;.]+|[\s|,;.]+$/g,'').replace(/^(and|en)\s+/i,'');if(!c||/minimum|required|following|between|periods?/i.test(c))continue;
   let paren='';const pm=c.match(/\((.*?)\)/);c=c.replace(/\s*\(.*$/,'').trim()||c;items.push(c.split(/,\s*|\s+and\s+|\s+en\s+|\s*\/\s*|\s+&\s+/i).filter(Boolean).map(x=>known(x)?cropAf(x):x.trim()).join(', ')+' '+m[2]+(m[2]==='1'?' dag':' d'))}
  if(items.length)out.phi=items.join(' | ')}
 // pack
 const pm=flat.match(/Net\s+(?:Volume|Mass|Content|Inhoud|Netto)[^\d]{0,80}?(\d+(?:[.,]\d+)?)\s*(ℓ|L|l|kg|g|mℓ|ml)\b/i)||flat.match(/(\d+(?:[.,]\d+)?)\s*(ℓ|L|kg)\s*\n[^\n]*Net\s+(?:Volume|Mass)/i);
 if(pm)out.pack={size:parseFloat(pm[1].replace(',','.')),unit:/kg/i.test(pm[2])?'kg':/^(g)$/i.test(pm[2])?'g':/m/i.test(pm[2])?'ml':'lt'};
 // dose: uppercase crop headings followed by rate lines
 const doseMap=new Map();let cur=null;const rateRe=/(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)\s*(mℓ|ml|ℓ|l|L|g|kg)\s*\/\s*(100\s*(?:ℓ|l|L)|ha)/gi;
 for(const l of L){const hm=l.match(/^\s{0,6}([A-ZÀ-Ü][A-ZÀ-Ü ,&\/\-]{2,38}[A-ZÀ-Ü])\s*:?(?=\s{2,}|$|\s+[A-Z][a-z]|:)/);
  if(hm&&known(hm[1])&&!/APPLICATION|CROP|FOLIAR|CONTINUED|NOTE|WARNING|WITHHOLDING|DIRECTIONS|RECOMMEND|STORAGE|FIRST AID|MIXING|PEST|GROUND|AERIAL|DRENCH|BROADCAST|BAND|TRIAL|RESISTANCE|REGISTRATION|HAZARD|PRECAUTION|ACTIVE|GROUP|SAFETY|ENVIRONMENT|DISPOSAL|EMERGENCY|KEEP|READ/.test(hm[1])){cur=cropAf(hm[1]);if(!doseMap.has(cur))doseMap.set(cur,[])}
  if(cur){let m;rateRe.lastIndex=0;while((m=rateRe.exec(l))){const u=m[2].replace('ml','mℓ').replace(/^l$|^L$/,'ℓ');const per=/ha/i.test(m[3])?'/ha':'/100 ℓ';const r=m[1].replace(/\s/g,'').replace('.',',')+' '+u+per;const a=doseMap.get(cur);if(a&&!a.includes(r))a.push(r)}}}
 out.dose=[...doseMap].filter(([c,a])=>a.length).map(([c,a])=>c+': '+a.slice(0,3).join(' / ')).join('\n');
 return out}


async function pdfText(file){if(!window.pdfjsLib)throw new Error('lib');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let out=[];
 for(let n=1;n<=doc.numPages;n++){const pg=await doc.getPage(n);const tc=await pg.getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]);let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r){r={y,a:[]};rows.push(r)}r.a.push({x:it.transform[4],w:it.width,t:it.str})});
  rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.a.sort((a,b)=>a.x-b.x);let line='',end=0;r.a.forEach(c=>{if(line){const gap=c.x-end;line+=gap>25?'   ':' '}else line=' '.repeat(Math.min(30,Math.round(c.x/6)));line+=c.t;end=c.x+c.w});out.push(line)});out.push('')}
 return out.join('\n')}

 else if(dir==='D'){ok=q.top>r.top+12;d=(q.top-r.top)*3+Math.abs(q.left-r.left)}else{ok=q.top<r.top-12;d=(r.top-q.top)*3+Math.abs(q.left-r.left)}

(function(){const b=document.createElement('button');b.type='button';b.id='clrx';b.textContent='×';b.setAttribute('aria-label','Vee uit');b.hidden=true;document.body.appendChild(b);let cur=null;
 const ok=t=>t&&t.tagName==='INPUT'&&!['checkbox','radio','file','button','submit','range','color','date'].includes(t.type)&&!t.readOnly&&!t.disabled;
 function pos(){if(!cur||!document.body.contains(cur)||!cur.value){b.hidden=true;return}const r=cur.getBoundingClientRect();if(r.width<60||r.bottom<0||r.top>innerHeight){b.hidden=true;return}b.hidden=false;b.style.top=(r.top+r.height/2-13)+'px';b.style.left=(r.right-30)+'px'}
 document.addEventListener('focusin',e=>{cur=ok(e.target)?e.target:null;pos()});
 document.addEventListener('input',e=>{if(e.target===cur)pos()});
 document.addEventListener('focusout',e=>{if(e.target===cur)setTimeout(()=>{if(document.activeElement!==cur&&document.activeElement!==b)b.hidden=true},150)});
 window.addEventListener('scroll',pos,true);window.addEventListener('resize',pos);
 b.addEventListener('mousedown',e=>e.preventDefault());
 b.addEventListener('click',e=>{e.preventDefault();if(!cur)return;const t=cur;t.value='';t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>{const n=document.body.contains(t)?t:document.querySelector(t.dataset.m!==undefined?`[data-m="${t.dataset.m}"]`:t.dataset.hq!==undefined?'[data-hq]':t.dataset.sq!==undefined?'[data-sq]':t.dataset.cq!==undefined?'[data-cq]':t.dataset.pq!==undefined?'[data-pq]':t.dataset.dq!==undefined?'[data-dq]':t.dataset.lq!==undefined?'[data-lq]':'#none');if(n){cur=n;n.focus()}pos()},30)});
 setInterval(pos,400)})();

/* ===== Inlyn-outovoltooi: tik 'n woord, die res verskyn gekies; Tab of Enter maak dit klaar ===== */
(function(){
 const attrs=['m','pq','hq','dq','lq'];
 const keyOf=t=>{const d=t.dataset||{};for(const a of attrs)if(d[a]!==undefined)return a==='m'?'m:'+d.m:a;return null};
 function source(k){
  try{
   if(k==='m:boer')return boerNames();
   if(k==='m:plaas'||k==='m:blok'||k==='m:agronoom')return S.hist[k.slice(2)]||[];
   if(k==='m:gewas')return CROPS.concat(S.hist.gewas||[]);
   if(k==='pq'||k==='dq')return products().map(p=>p.name);
   if(k==='hq')return (S.home&&S.home.sec==='boere'&&S.home.boer==null)?boerNames():CROPS.concat(S.hist.gewas||[]);
   if(k==='lq')return S.programs.map(p=>p.meta.boer).concat(S.programs.map(p=>p.meta.gewas)).filter(Boolean);
  }catch(e){}
  return [];}
 document.addEventListener('input',e=>{
  if(e.isComposing||(e.inputType&&e.inputType.indexOf('delete')===0))return;
  let t=e.target;const k=t&&t.tagName==='INPUT'?keyOf(t):null;if(!k)return;
  if(!document.body.contains(t)){const n=document.querySelector(k==='pq'||k==='hq'||k==='dq'||k==='lq'?'[data-'+k+']':'[data-m="'+k.slice(2)+'"]');if(!n||document.activeElement!==n)return;t=n}
  const v=t.value;if(!v||t.selectionStart!==v.length||t.selectionEnd!==v.length)return;
  const low=v.toLowerCase();const seen=new Set();let hit=null;
  for(const c of source(k)){const x=String(c||'').trim();if(!x||seen.has(x))continue;seen.add(x);if(x.length>v.length&&x.toLowerCase().startsWith(low)){hit=x;break}}
  if(!hit)return;
  t.value=hit;t.setSelectionRange(v.length,hit.length)
 },false);
})();

function shareHTML(){const f=S.share.fmt;const fs=!!(navigator.canShare&&window.File);return `<div class="shp"><div class="row"><b>📤 Deel hierdie program</b><span class="sp"></span><button class="btn ghost sm" data-a="sharex">✕</button></div>

async function shareGo(via){const sh=S.share;if(!sh)return;const id=sh.id==='cur'?undefined:sh.id;let r=null;
 try{r=sh.fmt==='xlsx'?await doXLSX(id,{blob:true}):await doPDF(id,{blob:true})}catch(e){r=null}
 if(!r||!r.blob){toast('Kon nie die lêer maak nie');return}
 const m=r.m||{};const ttl='Spuitprogram'+(m.gewas?' – '+m.gewas:'')+(m.boer?' ('+m.boer+')':'');
 const msg=ttl+(m.plaas?'\nPlaas: '+m.plaas:'')+(m.blok?'\nLand / blok: '+m.blok:'')+'\n\nNylverspreiders | 076 499 7567 | admin@nylverpreiders.co.za';
 let file=null;try{file=new File([r.blob],r.name,{type:r.type})}catch(e){}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:ttl,text:msg});toast('Gedeel');return}catch(e){if(e&&e.name==='AbortError')return}}
 if(via==='sys'){toast('Deel word nie op hierdie toestel ondersteun nie');return}
 await saveFile(r.name,r.blob);
 const u=via==='wa'?'https://wa.me/?text='+encodeURIComponent(msg+'\n\n(Lêer: '+r.name+' – aangeheg)'):'mailto:?subject='+encodeURIComponent(ttl)+'&body='+encodeURIComponent('Goeie dag\n\nAangeheg is die '+ttl.toLowerCase()+'.\n\n'+msg);
 try{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}catch(e){}
 toast((via==='wa'?'WhatsApp':'E-pos')+' maak oop – heg die afgelaaide lêer '+r.name+' aan')}
